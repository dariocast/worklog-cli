[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "worklog-cli"
version = "0.2.0"
description = "Billable time from AI agent chats and manual logs, in a local ledger"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "WorkLog CLI contributors"}]
keywords = ["time-tracking", "cli", "sqlite", "agents"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX"]

[project.scripts]
worklog = "worklog_cli.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "build>=1.2,<2"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
