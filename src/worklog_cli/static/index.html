<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>WorkLog board</title>
<link rel="stylesheet" href="/ui.css">
<link rel="stylesheet" href="/board.css">
<script src="/board.js" defer></script>
</head>
<body>
<header class="top">
  <h1 class="brand"><span class="brand-mark" aria-hidden="true">W</span>WorkLog</h1>
  <form id="capture" autocomplete="off">
    <textarea id="capture-input" class="textarea" rows="1" maxlength="4000" autofocus
              placeholder="Note something to do… “@project text” files it in a project"
              aria-label="New task" aria-describedby="capture-help"></textarea>
    <span id="capture-help" class="sr-only">Enter adds it; Shift+Enter starts a new line, and the first line is the title.</span>
    <span class="kbd" aria-hidden="true">/</span>
  </form>
  <div class="tabs-list views" role="group" aria-label="View">
    <button type="button" class="tabs-trigger" data-view="board" aria-pressed="false">Board</button>
    <button type="button" class="tabs-trigger" data-view="list" aria-pressed="false">List</button>
    <button type="button" class="tabs-trigger" data-view="timeline" aria-pressed="false">Timeline</button>
  </div>
</header>
<main id="main"></main>
<div id="toast" class="toast" role="status" hidden>
  <span class="toast-text"></span>
  <button type="button" class="btn btn-ghost btn-icon" aria-label="Dismiss">×</button>
</div>
</body>
</html>
